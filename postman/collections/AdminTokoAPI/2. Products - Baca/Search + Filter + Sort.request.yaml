$kind: http-request
url: "{{base_url}}/api/products?search=lap&category_id=1&min_price=1000000&sort_by=price&order=desc&per_page=5"
method: GET
headers:
  Accept: application/json
queryParams:
  search: lap
  category_id: "1"
  min_price: "1000000"
  sort_by: price
  order: desc
  per_page: "5"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Search 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
