$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: email
      value: test@example.com
    - type: text
      key: password
      value: salah
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Login salah 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 3000
