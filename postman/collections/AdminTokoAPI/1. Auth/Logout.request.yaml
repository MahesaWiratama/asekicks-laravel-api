$kind: http-request
description: Jalankan paling akhir. Setelah ini token tidak berlaku, login ulang.
url: "{{base_url}}/api/logout"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('Logout 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
