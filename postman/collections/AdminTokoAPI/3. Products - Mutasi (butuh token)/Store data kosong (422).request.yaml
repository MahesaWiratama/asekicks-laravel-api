$kind: http-request
url: "{{base_url}}/api/products"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: ""
scripts:
  - type: afterResponse
    code: pm.test('Validasi 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 2000
